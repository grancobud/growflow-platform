name: CI

# Corre en cada push a main y en cada pull request. La idea es que el estándar
# lo sostenga el sistema y no la memoria de quien sube el código.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Tipos y tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El typecheck va primero: si los tipos no cierran, los tests que pasen
      # no significan nada.
      - name: Verificar tipos
        run: npx tsc -b --noEmit

      - name: Tests
        run: npm test

  lint:
    name: Lint (informativo)
    runs-on: ubuntu-latest
    # No bloquea. Hoy hay 33 errores abiertos, casi todos de reglas de
    # react-hooks en componentes. Están acá para que se vean y se vayan
    # limpiando, no para fingir que no existen apagando la regla.
    continue-on-error: true

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint
