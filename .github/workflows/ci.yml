name: CI

# Corre en cada push a main y en cada pull request. La idea es que el estándar
# lo sostenga el sistema y no la memoria de quien sube el código.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El typecheck va primero: si los tipos no cierran, los tests que pasen
      # no significan nada.
      - name: Verificar tipos
        run: npx tsc -b --noEmit

      # Bloquea. Cero errores hoy, así que cualquier error nuevo rompe la build,
      # que es para lo único que sirve un lint en CI.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
